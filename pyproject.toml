[project]
name = "multi-agent-news-investigator-mongodb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.6.17",
    "google-genai>=2.13.0",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "tavily-python>=0.8.4",
    "trafilatura>=2.3.0",
]

[build-system]

requires = ["hatchling"]

build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]

packages = ["src/investigator"]
